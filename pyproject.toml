[project]
name = "calendar-event-template-creator"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "jinja2",
    "python-multipart",
    "sqlalchemy",
    "caldav",
    "icalendar",
    "argon2-cffi",
    "cryptography",
    "itsdangerous",
    "python-decouple>=3.8",
    "psycopg2-binary>=2.9.12",
    "httpx2>=2.12.0",
    "alembic>=1.19.2",
]

[dependency-groups]
dev = [
    "pytest",
    "httpx",
]

[tool.ruff.lint]
ignore = ["B008", "F821", "UP037"]
