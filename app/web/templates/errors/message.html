{% extends "base.html" %}

{% block title %}{{ heading }}{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-6">
    <h1>{{ heading }}</h1>
    <p>{{ message }}</p>
    {% if link_url %}
      <a href="{{ link_url }}">{{ link_text }}</a>
    {% endif %}
  </div>
</div>
{% endblock %}
