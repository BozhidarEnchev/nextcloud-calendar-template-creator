<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}{% endblock %} · Event creator</title>
    <script>
      // Bootstrap 5.3 only switches to its dark palette when data-bs-theme is set,
      // so follow the OS preference. Runs in <head> to avoid a flash of light theme.
      (function () {
        const query = window.matchMedia("(prefers-color-scheme: dark)");
        const apply = () => document.documentElement.setAttribute("data-bs-theme", query.matches ? "dark" : "light");
        apply();
        query.addEventListener("change", apply);
      })();
    </script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link href="{{ url_for('static', path='css/style.css') }}" rel="stylesheet">
    <script src="{{ url_for('static', path='vendor/htmx.min.js') }}"></script>
</head>
<body class="d-flex flex-column min-vh-100">
    <nav class="navbar navbar-expand-sm bg-body border-bottom">
      <div class="container">
        <a class="navbar-brand fw-semibold" href="{{ url_for('index') if current_user else url_for('login-page') }}">Event creator</a>

        {% if current_user %}
          <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#main-nav"
                  aria-controls="main-nav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
          </button>

          <div class="collapse navbar-collapse" id="main-nav">
            <ul class="navbar-nav me-auto">
              <li class="nav-item">
                <a class="nav-link{{ ' active' if active_page == 'home' }}" href="{{ url_for('index') }}">Home</a>
              </li>
              <li class="nav-item">
                <a class="nav-link{{ ' active' if active_page == 'templates' }}" href="{{ url_for('event_templates') }}">Templates</a>
              </li>
              <li class="nav-item">
                <a class="nav-link{{ ' active' if active_page == 'nextcloud' }}" href="{{ url_for('nextcloud_account') }}">Nextcloud</a>
              </li>
            </ul>

            <div class="dropdown">
              <button class="btn btn-outline-secondary btn-sm dropdown-toggle" type="button" data-bs-toggle="dropdown" aria-expanded="false">
                {{ current_user.username }}
              </button>
              <ul class="dropdown-menu dropdown-menu-end">
                <li>
                  <form method="post" action="{{ url_for('logout') }}">
                    <button type="submit" class="dropdown-item">Log out</button>
                  </form>
                </li>
                <li><hr class="dropdown-divider"></li>
                <li>
                  <form method="post" action="{{ url_for('user_delete') }}"
                        onsubmit="return confirm('Delete your account and everything in it? This cannot be undone.');">
                    <button type="submit" class="dropdown-item text-danger">Delete account…</button>
                  </form>
                </li>
              </ul>
            </div>
          </div>
        {% endif %}
      </div>
    </nav>

    <main class="container py-4 py-md-5 flex-grow-1">
    {% block content %}
    {% endblock content %}
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
