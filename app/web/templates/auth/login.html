{% extends "base.html" %}

{% block title %}Log in{% endblock %}

{% block content %}
<div class="page-narrow">
  <div class="card shadow-sm">
    <div class="card-body p-4">
      <h1 class="h4 mb-1">Log in</h1>
      <p class="text-body-secondary small mb-4">Create Nextcloud calendar events from your own templates.</p>

      {% if error %}
        <div class="alert alert-danger" role="alert">{{ error }}</div>
      {% endif %}

      <form method="post" action="{{ url_for('login') }}" name="login">
        <div class="mb-3">
          <label for="username-field" class="form-label">Username</label>
          <input type="text" name="username" class="form-control" id="username-field"
                 autocomplete="username" autofocus required>
        </div>
        <div class="mb-4">
          <label for="password-field" class="form-label">Password</label>
          <input type="password" name="password" class="form-control" id="password-field"
                 autocomplete="current-password" required>
        </div>
        <button type="submit" class="btn btn-primary w-100">Log in</button>
      </form>
    </div>
    <div class="card-footer bg-transparent text-center small py-3">
      No account yet? <a href="{{ url_for('register-page') }}">Register</a>
    </div>
  </div>
</div>
{% endblock %}
