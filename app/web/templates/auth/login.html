{% extends "base.html" %}

{% block title %}Login{% endblock %}

{% block content %}
<div class="row justify-content-center">
  {% if error %}
    <p style="color: red;">{{ error }}</p>
  {% endif %}
  <form method="post" class="col-4" name="login">
    <div class="mb-3">
      <label for="username-field" class="form-label">Username</label>
      <input type="text" name="username" class="form-control" id="username-field">
    </div>
    <div class="mb-3">
      <label for="password-field" class="form-label">Password</label>
      <input type="password" name="password" class="form-control" id="password-field">
    </div>
    <button type="submit" class="btn btn-success">Login</button>
    <a class="d-block pt-2 text-decoration-none" href="./register">No account? Click to register!</a>
  </form>
</div>
{% endblock %}
