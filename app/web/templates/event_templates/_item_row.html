<li id="item-{{ item.id }}" class="list-group-item d-flex align-items-center gap-3">
  <span class="time-range font-monospace small text-body-secondary text-nowrap">
    {{ item.start_time.strftime('%H:%M') }}&ndash;{{ item.end_time.strftime('%H:%M') }}
  </span>
  <div class="flex-grow-1">
    <div class="fw-semibold">{{ item.title }}</div>
    {% if item.location or item.description %}
      <div class="small text-body-secondary">
        {{ item.location }}{% if item.location and item.description %} &middot; {% endif %}{{ item.description }}
      </div>
    {% endif %}
  </div>
  <button
    type="button"
    class="btn btn-sm btn-outline-danger"
    hx-delete="{{ url_for('event_template_item_delete', template_id=event_template.id, item_id=item.id) }}"
    hx-target="#item-{{ item.id }}"
    hx-swap="outerHTML"
    hx-confirm="Delete '{{ item.title }}'?"
  >
    Delete
  </button>
</li>
